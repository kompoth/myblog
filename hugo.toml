baseURL = "https://kmicic.net/"
languageCode = "en-us"
title = "⬡⬢⬡ Vasilii Negrebetskii"
theme = "typo"

[taxonomies]
tag = "tags"

[params]
description = "A tech-oriented personal blog"

theme = "auto"
colorPalette = "gruvebox"

homeIntroTitle = "Hi, my name is Vasilii -`ღ´-"
homeIntroContent = """
I am a somewhat seasoned Python Developer and MLOps Engineer, ex-FinTech. Always building something.

I have an M.Sc. in Physics, and I am still passionate about stars and why they burn.

In my free time I like to do [HEMA](https://en.wikipedia.org/wiki/Historical_European_martial_arts), tabletop RPGs, and wargames.

But most importantly, I am a loving husband and cat dad.

*Kmicic* is a nickname taken in middle school after the main character of Henryk Sienkiewicz's historical novel *The Deluge*.
We have to carry the burden of our questionable decisions made in childhood all our lives, I guess.
"""

hideHeader = true
showFooter = true
